# CI da VerboLang — runner nomeado na entrega da Etapa 1 (docs/PLAN.md §1.3 a):
# GitHub Actions. A mesma suíte roda localmente via `make test`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: Suíte de testes (TDD + BDD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Checagens estáticas (shell + JS da UI)
        run: make check

      - name: Testes unitários (TDD) — PLAN §1.2
        run: python -m pytest -q tests/unit

      - name: Cenários BDD — PLAN §1.1
        run: python -m behave tests/features

  nucleo:
    name: Núcleo Rust (Etapa 2 — clippy + testes + ASan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nucleo
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleo

      - name: Clippy (zero warnings — AGENTS §1.3)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes (matriz 41 · canon 5 · transição 36)
        run: cargo test

      # Vazamentos: ASan/LSan (AGENTS §1.3 — ASan/Valgrind)
      - name: ASan (vazamentos de heap)
        run: |
          RUSTFLAGS="-Zsanitizer=address" \
            cargo +nightly test --workspace --target x86_64-unknown-linux-gnu

      # Orçamentos de latência (AGENTS §1.3): transição ≤100µs p95,
      # FXP ≤10µs por mensagem — medidos com criterion; roda rápido (quick)
      - name: Benchmarks (critério de latência)
        run: cargo bench --bench transicao --bench escalonador -- --quick

      # A validação do cheat sheet (PLAN §7) exige o LLM local e roda como
      # job manual na máquina do desenvolvedor:
      #   make serve  →  make validate-cheatsheet
