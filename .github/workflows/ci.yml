# CI da VerboLang — runner nomeado na entrega da Etapa 1 (docs/PLAN.md §1.3 a):
# GitHub Actions. A mesma suíte roda localmente via `make test`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: Suíte de testes (TDD + BDD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Checagens estáticas (shell + JS da UI)
        run: make check

      - name: Testes unitários (TDD) — PLAN §1.2
        run: python -m pytest -q tests/unit

      - name: Cenários BDD — PLAN §1.1
        run: python -m behave tests/features

  core:
    name: Núcleo Rust (Etapas 2–3 — clippy + testes + ASan + FXP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      # Nightly primeiro (só para o ASan abaixo); o stable por último fica
      # como default do job (RUSTUP_TOOLCHAIN) — clippy/testes/bench rodam no
      # mesmo toolchain do `make rust-check` local, não no nightly mínimo.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Clippy (zero warnings — AGENTS §1.3)
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

      - name: Testes (matriz 42 · canon 5 · transição 36 · FXP schema/registro/drivers/transporte/bus · Caderno de produção 12)
        run: cargo test

      # E2E da Etapa 4 (PLAN §4.2): interpretador integrado (CLI + FXP +
      # Caderno de produção) nos cenários BDD da Etapa 1, com verificação
      # externa dos logs (vbl caderno-verify)
      - name: E2E — Caderno de produção e validação (PLAN §4.2)
        run: cargo test -p vbl-cli --test e2e

      # Publicação no crates.io (RELEASES.md § crates.io): empacota os
      # quatro crates e roda o verify build de cada pacote — readme ausente,
      # manifesto incompleto ou arquivo faltando quebram aqui, não na tag.
      # Estrito (sem --allow-dirty): o checkout é limpo por definição.
      - name: Empacotamento crates.io (verificação de pacote)
        run: cargo package --workspace --locked

      # Vazamentos: ASan/LSan (AGENTS §1.3 — ASan/Valgrind)
      - name: ASan (vazamentos de heap)
        run: |
          RUSTFLAGS="-Zsanitizer=address" \
            cargo +nightly test --workspace --target x86_64-unknown-linux-gnu

      # Orçamentos de heap (Etapa 5 — PLAN §5.1; AGENTS §2.2): auditor de
      # contagem por forma + steady-state 10k ≤ 10 MB + churn 200k sem inércia
      - name: Memória (orçamentos de heap, auditor serial)
        run: cargo test -p vbl-runtime --features heap-audit --test memoria -- --test-threads=1

      # Orçamentos de latência (AGENTS §1.3): transição ≤100µs p95,
      # FXP: mensagem ≤10µs, leitura local ≤1ms, remota ≤10ms;
      # Caderno (Etapa 4): gravação ≤200µs + A/B de overhead — criterion (quick)
      - name: Benchmarks (critério de latência)
        run: cargo bench --bench transition --bench scheduler --bench fxp --bench ledger -- --quick

      # Auditoria do registro FXP do host (FORMAL §6 — cobertura obrigatória;
      # no runner sem sysfs/registro rico, roda contra o mínimo simulado)
      - name: fxp-probe (cobertura §6)
        run: cargo run -p vbl-cli -- fxp-probe

      # A validação do cheat sheet (PLAN §7) exige o LLM local e roda como
      # job manual na máquina do desenvolvedor:
      #   make serve  →  make validate-cheatsheet
