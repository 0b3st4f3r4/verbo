# Registro FXP do laboratório (31/08/2026) — rota real onde o hardware permite.
# mode híbrido: reais onde há endpoint acessível; simulados no restante (§4.7).
mode = hibrido

# CPU real: k10temp (AMD Zen), mili°C — temperatura física do package.
# (hwmon4 = k10temp nesta sessão; renumerado pelo kernel entre boots —
#  confirmar com: grep -l k10temp /sys/class/hwmon/hwmon*/name)
cpu_temp.mode = real
cpu_temp.endpoint = hwmon_temp:/sys/class/hwmon/hwmon4/temp1_input

# Energia real do package (RAPL, µJ) — requer energy_uj legível (root).
cpu_power.mode = real
cpu_power.endpoint = rapl_energy:/sys/devices/virtual/powercap/intel-rapl/intel-rapl:0

# Este host NÃO expõe constraint de power limit (sem constraint_*_uw no
# domínio) — ator real declarado para exercitar a falha honesta do §4.7:
# atuação ⇒ alerta no Caderno, comando não enviado, sem fabricação.
CpuPowerCap.mode = real
CpuPowerCap.endpoint = rapl_constraint:/sys/devices/virtual/powercap/intel-rapl/intel-rapl:0/intel-rapl:0:0/constraint_0_power_limit_uw

# Sem hardware acessível nesta máquina: fan não expõe pwm; LED e atenção
# dependem de backend — ficam simulados (obrigatório para attention, §6).
Ventoinha.mode = simulado
LedIndicador.mode = simulado
attention.mode = simulado
