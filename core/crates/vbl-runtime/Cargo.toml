[package]
name = "vbl-runtime"
description = "VerboLang — motor de tick, escalonador, FXP simulado e Caderno (FORMAL §4)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["verbolang", "runtime", "scheduler", "interpreter", "tick"]
categories = ["compilers", "simulation"]

[dependencies]
vbl-lang = { workspace = true }
sha2 = { workspace = true }

# Etapa 5 (PLAN §5.1): auditor de heap — opt-in, nunca em produção.
[features]
heap-audit = []

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "transition"
harness = false

[[bench]]
name = "scheduler"
harness = false

[[bench]]
name = "ledger"
harness = false

# Soak de longa execução (Etapa 5 — AGENTS §2.2: heap estável em longa duração)
[[bin]]
name = "vbl-soak"
path = "src/bin/soak.rs"
