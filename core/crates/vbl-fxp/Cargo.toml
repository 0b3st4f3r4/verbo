[package]
name = "vbl-fxp"
description = "VerboLang — Flux Protocol: schema v1, registro, drivers reais/simulados e transporte (Etapa 3, PLAN §3)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["verbolang", "sensors", "actuators", "simulation", "hardware"]
categories = ["hardware-support", "simulation"]

[[bench]]
name = "fxp"
harness = false

[dependencies]
vbl-runtime = { workspace = true }
lz4_flex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
# v1.2: TLS do transporte remoto (§7) e multicast IPv6/SSM do beacon (§4.9).
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
socket2 = { workspace = true }
mdns-sd = { workspace = true, optional = true }
# v1.3 (§4.8): zstd com dicionário treinado — algoritmo 3, só negociado.
zstd = { workspace = true }

# v1.3 (§4.9): SSM IPv6 — a assinatura (grupo, fonte) v6 não existe nem no
# std nem no socket2 0.6; a chamada crua `setsockopt(IPPROTO_IPV6,
# MCAST_JOIN_SOURCE_GROUP)` (RFC 3678/4604) resolve em Linux. Outras
# plataformas: join v6 com fonte falha honesto (`MulticastIndisponivel`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[features]
# mDNS/DNS-SD (v1.2 §4.10): descoberta adicional opt-in — o fio §2 não muda.
mdns = ["dep:mdns-sd"]

[dev-dependencies]
criterion = { workspace = true }
vbl-lang = { workspace = true }
# v1.2: certificados autoassinados de teste (par servidor/cliente TLS).
rcgen = { workspace = true }
