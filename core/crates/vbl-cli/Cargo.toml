[package]
name = "vbl-cli"
description = "VerboLang — interpretador de console `.vl` (entregáveis das Etapas 2–4, PLAN §2.3/§3/§4)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["verbolang", "cli", "interpreter"]
categories = ["command-line-utilities", "compilers"]

[[bin]]
name = "vbl"
path = "src/main.rs"

[dependencies]
vbl-lang = { workspace = true }
vbl-runtime = { workspace = true }
vbl-fxp = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[dev-dependencies]
# v1.2: e2e TLS — cert autoassinado + impressão digital sem depender do bin.
rcgen = { workspace = true }
sha2 = { workspace = true }

[features]
# mDNS/DNS-SD (v1.2 §4.10): anúncio/descoberta opt-in via mdns-sd.
mdns = ["vbl-fxp/mdns"]
