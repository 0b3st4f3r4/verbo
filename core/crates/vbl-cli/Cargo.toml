[package]
name = "vbl-cli"
description = "VerboLang — interpretador de console `.vl` (entregável da Etapa 2, PLAN §2.3)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["verbolang", "cli", "interpreter"]
categories = ["command-line-utilities", "compilers"]

[[bin]]
name = "vbl"
path = "src/main.rs"

[dependencies]
vbl-lang = { workspace = true }
vbl-runtime = { workspace = true }
vbl-fxp = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
