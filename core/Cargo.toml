[workspace]
resolver = "2"
members = ["crates/vbl-lang", "crates/vbl-runtime", "crates/vbl-fxp", "crates/vbl-cli"]

[workspace.package]
# v2027.0.0-alpha.0 — o primeiro pré-lançamento da linha v2027.0, conforme a
# gramática `vYYYY.0.0-alpha.N` (RELEASES.md § cargo/SemVer): fase alpha
# (pesquisa, experimentação e definição de escopo), tudo pode mudar. A tag
# de corte é `v2027.0.0-alpha.0` (o gate do publish.yml compara a tag, sem
# o `v`, com esta versão).
version = "2027.0.0-alpha.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Silvano Neto"]
# Piso real do núcleo, verificado pelo clippy::incompatible_msrv no CI:
# u64::is_multiple_of (1.87) no vbl-runtime. Qualquer API mais nova que o
# campo declarado quebra o clippy — suba o número junto com o código.
rust-version = "1.87"
repository = "https://github.com/0b3st4f3r4/verbo"

[workspace.dependencies]
sha2 = "0.10"
criterion = "0.5"
# v1.1 (docs/FXP-SCHEMA-v1.md §4.8): LZ4 block puro-Rust, sem unsafe, para a
# compressão negociada do corpo — a reserva v1.1 "frames ≤ 8 KB não justificam
# zstd/dep C" vale para o LZ4 COMO ÚNICO algoritmo; a v1.3 adiciona o zstd
# como algoritmo ADICIONAL negociado (id 3, dicionário treinado §4.8), onde o
# custo C se paga: estatísticas treinadas entre frames e razão maior em
# payloads com nomes novos.
lz4_flex = "0.11"
# v1.3 (§4.8): zstd (bind C via cc — sem cmake) com dicionário treinado
# (`zstd::dict::from_samples`, COVER — feature `zdict_builder`, default).
# Só trafega negociado (caps::ZSTD + caps::DICT, id 3 no byte reservado);
# fio default continua bit a bit v1.0/v1.1/v1.2.
zstd = "0.13"
# v1.3 (§4.9): SSM IPv6 via `setsockopt(IPPROTO_IPV6, MCAST_JOIN_SOURCE_GROUP)`
# (RFC 3678/4604) — nem std nem socket2 0.6 expõem assinatura de grupo por
# fonte para v6; a chamada crua desbloqueia o item registrado na §9 da v1.2.
libc = "0.2"
# v1.1 (§4.6): PSK + HMAC-SHA256 para autenticação do canal remoto (a chave
# nunca trafega; nonces por conexão) — hmac/getrandom puro-Rust, sha2 já era
# dependência do workspace (cadeia do Caderno).
hmac = "0.12"
getrandom = "0.3"
# v1.2 (docs/FXP-SCHEMA-v1.md §7/§9): TLS 1.3 via rustls sob os frames —
# confidencialidade e MAC por frame (cada frame ≤ 8196 B viaja em um registro
# AEAD). Provider `ring` (o default aws-lc-rs exige cmake; o provider
# rustcrypto ainda é alpha). rustls não expõe TLS-PSK (issue rustls/rustls#174)
# — a confiança é impressão digital SHA-256 do certificado do servidor,
# fixada no endpoint (`tcps:`). rustls_pemfile carrega os PEMs.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2"
# v1.2 (§4.9): sockets multicast com SSM (join_ssm_v4, IPv4) e join IPv6 —
# std::net não expõe assinatura de grupo por fonte.
socket2 = "0.6"
# mDNS/DNS-SD (v1.2 §4.10) — puro Rust, thread própria, sem runtime async.
mdns-sd = "0.21"
# v1.2 (dev): certificados autoassinados dos testes TLS (par servidor/cliente).
rcgen = "0.14"
# Dependências internas carregam version + path: o path manda dentro do
# workspace; no `cargo publish` o version é que entra no manifesto — sem ele
# o crates.io recusa o pacote do dependente. O req ^2027.0.0-alpha.0 casa os
# pré-lançamentos seguintes do mesmo trio (2027.0.0-alpha.N, beta.N, rc)
# durante a fase.
vbl-lang = { version = "2027.0.0-alpha.0", path = "crates/vbl-lang" }
vbl-runtime = { version = "2027.0.0-alpha.0", path = "crates/vbl-runtime" }
vbl-fxp = { version = "2027.0.0-alpha.0", path = "crates/vbl-fxp" }

[profile.bench]
debug = true
