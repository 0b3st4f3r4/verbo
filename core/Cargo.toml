[workspace]
resolver = "2"
members = ["crates/vbl-lang", "crates/vbl-runtime", "crates/vbl-fxp", "crates/vbl-cli"]

[workspace.package]
# Estreia pública no crates.io: 0.1.0-alpha.0 — o análogo SemVer da
# gramática `vYYYY.0.0-alpha.N` (RELEASES.md § cargo/SemVer): pré-alpha,
# tudo pode mudar. A tag de corte é `v0.1.0-alpha.0` (o gate do
# publish.yml compara a tag, sem o `v`, com esta versão).
version = "0.1.0-alpha.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Silvano Neto"]
# Piso real do núcleo, verificado pelo clippy::incompatible_msrv no CI:
# u64::is_multiple_of (1.87) no vbl-runtime. Qualquer API mais nova que o
# campo declarado quebra o clippy — suba o número junto com o código.
rust-version = "1.87"
repository = "https://github.com/0b3st4f3r4/verbo"

[workspace.dependencies]
sha2 = "0.10"
criterion = "0.5"
# Dependências internas carregam version + path: o path manda dentro do
# workspace; no `cargo publish` o version é que entra no manifesto — sem ele
# o crates.io recusa o pacote do dependente. O req ^0.1.0-alpha.0 casa as
# alphas/betas seguintes do mesmo trio (0.1.0-alpha.N) durante a fase.
vbl-lang = { version = "0.1.0-alpha.0", path = "crates/vbl-lang" }
vbl-runtime = { version = "0.1.0-alpha.0", path = "crates/vbl-runtime" }
vbl-fxp = { version = "0.1.0-alpha.0", path = "crates/vbl-fxp" }

[profile.bench]
debug = true
