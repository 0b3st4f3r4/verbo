<!--
verbolog-banner.svg — banner do projeto.
  Emblema triangular de metal sobre vidro à esquerda; a linha
  tracejada do horizonte passa pela fileira dos três pássaros do
  emblema e segue sob o traço espectral
  (azul→teal→verde→amarelo→vermelho), cujo pássaro mergulha abaixo
  da linha.
Parte do projeto VerboLang — licenciado sob a GNU GPL-3.0 (ver LICENSE).
-->
