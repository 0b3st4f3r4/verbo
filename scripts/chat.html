<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VerboLang</title>
<link rel="icon" type="image/svg+xml" href="verbolog.svg">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<!--
  chat.html — UI de consulta direta ao modelo (vLLM :8000).
  Single-file, sem dependências: streaming SSE via fetch, markdown mínimo
  (blocos de código, `inline`, **negrito**) com escape prévio — seguro por
  construção. Aberta automaticamente por scripts/serve-local-llm.sh.

  Configuração por fragmento da URL (não vai em logs de servidor):
    #k=<api-key>&u=<base-url>&m=<modelo>&c=<ctx>
  Marca: verbolog.svg (logo + favicon). Temas: claro, metal, escuro.
  Idiomas: pt, en, zh, ru, hi, af, ar (RTL). Preferências em localStorage.
  Parte do projeto VerboLang — licenciado sob a GNU GPL-3.0 (ver LICENSE).
-->
<style>
  /* ── fontes auto-hospedadas (SIL OFL 1.1 — ver fonts/LICENSE-FONTS.txt) ── */
  @font-face {
    font-family: "Inter";
    font-style: normal; font-weight: 400; font-display: swap;
    src: url("fonts/inter-latin-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal; font-weight: 600; font-display: swap;
    src: url("fonts/inter-latin-600.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal; font-weight: 700; font-display: swap;
    src: url("fonts/inter-latin-700.woff2") format("woff2");
  }
  @font-face {
    font-family: "Iosevka";
    font-style: normal; font-weight: 400; font-display: swap;
    src: url("fonts/iosevka-latin-400.woff2") format("woff2");
  }

  /* ── temas ─────────────────────────────────────────────────────────── */
  :root, html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1319; --bg-glow: #16202b; --panel: #171d24; --panel-2: #1b232c;
    --border: #29323e; --border-soft: #212a34; --text: #dde6f0; --dim: #8fa1b5;
    --accent: #4da3ff; --ok: #3fb96f; --warn: #e0a83a; --bad: #e05c5c;
    --user-bubble: #1d3a5f; --user-bubble-text: #eaf2fc;
    --code-bg: #0d1116; --code-border: #212a34; --placeholder: #5d7086;
    --shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  html[data-theme="metal"] {
    color-scheme: dark;
    --bg: #24292f; --bg-glow: #2e353d; --panel: #333941; --panel-2: #3d4450;
    --border: #4a525d; --border-soft: #3f4750; --text: #e6eaee; --dim: #9aa6b2;
    --accent: #6db1f5; --ok: #4cba7f; --warn: #d8a944; --bad: #e06565;
    --user-bubble: #3a5a7e; --user-bubble-text: #eaf2fc;
    --code-bg: #272d34; --code-border: #3f4750; --placeholder: #7d8b99;
    --shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f5f8; --bg-glow: #e7edf4; --panel: #ffffff; --panel-2: #eaeef3;
    --border: #cfd7e0; --border-soft: #dde3ea; --text: #1b2530; --dim: #5a6a7b;
    --accent: #1f6fd6; --ok: #23804d; --warn: #a06f12; --bad: #c04343;
    --user-bubble: #d9e9fb; --user-bubble-text: #12233a;
    --code-bg: #eef2f6; --code-border: #dfe5ec; --placeholder: #8a97a5;
    --shadow: 0 4px 12px rgba(27,37,48,.12);
  }

  :root {
    --font-text: "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: "Iosevka", ui-monospace, "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
    --col: min(100%, 900px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    font: 15px/1.55 var(--font-text);
    background: radial-gradient(1200px 500px at 50% -10%, var(--bg-glow) 0%, var(--bg) 55%) fixed, var(--bg);
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }

  /* ── cabeçalho ─────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px clamp(12px, 3vw, 20px);
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border-bottom: 1px solid var(--border-soft);
    backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 34px; height: 34px; display: block; border-radius: 9px; flex: none; }
  .brand h1 { font-size: 14px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .brand .sub { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none;
         transition: background .3s; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px color-mix(in srgb, var(--ok) 70%, transparent); }
  .dot.err { background: var(--bad); }

  .meter { flex: 1 1 200px; max-width: 340px; margin-left: auto; }
  .meter .bar { height: 6px; background: var(--border-soft); border-radius: 3px; overflow: hidden; }
  .meter .fill { height: 100%; width: 0%; border-radius: 3px;
                 background: linear-gradient(90deg, var(--accent), var(--ok));
                 transition: width .35s ease; }
  .meter .lbl { font-size: 11px; color: var(--dim); margin-top: 3px; text-align: right;
                font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 13px; cursor: pointer; font-size: 13px;
    transition: border-color .15s, background .15s, transform .05s;
  }
  button:hover { border-color: var(--accent); background: var(--panel-2); filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button:focus-visible, textarea:focus-visible, summary:focus-visible,
  .chip:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .icon-btn {
    width: 34px; height: 34px; padding: 0;
    display: inline-grid; place-items: center;
  }
  .icon-btn svg { display: block; }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; font-size: 12.5px; cursor: pointer;
  }

  /* ── abas de sessão ────────────────────────────────────────────────── */
  #tabs {
    display: flex; align-items: center; gap: 6px;
    padding: 8px clamp(12px, 3vw, 20px) 0;
    width: 100%; max-width: var(--col); margin: 0 auto;
    overflow-x: auto; scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: inline-flex; align-items: center; gap: 6px;
    max-width: 200px; padding: 5px 10px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--border-soft);
    color: var(--dim); font-size: 12.5px;
  }
  .tab:hover { color: var(--text); border-color: var(--accent); }
  .tab[aria-selected="true"] {
    background: var(--panel-2); color: var(--text); border-color: var(--accent);
  }
  .tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-x { color: var(--dim); font-size: 14px; line-height: 1; }
  .tab-x:hover { color: var(--bad); }
  .tab-new { padding: 5px 12px; font-weight: 600; }
  .session-view { display: flex; flex-direction: column; gap: 12px; width: 100%; }

  /* ── área da conversa ──────────────────────────────────────────────── */
  .seg {
    display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; background: var(--panel);
  }
  .seg-btn {
    border: 0; border-radius: 0; background: transparent;
    padding: 6px 12px; font-size: 12.5px; color: var(--dim);
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--border-soft); }
  .seg-btn[aria-pressed="true"] { background: var(--panel-2); color: var(--accent); font-weight: 600; }
  .sheet-status { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  /* painel do prompt de sistema (abre pela engrenagem no compositor) */
  #sys-panel {
    width: var(--col); max-width: var(--col); margin: 0 auto 8px;
    background: var(--panel); border: 1px solid var(--border-soft);
    border-radius: 10px; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #system {
    width: 100%; background: var(--code-bg); color: var(--text);
    border: 1px solid var(--border-soft); border-radius: 8px;
    padding: 7px 10px; font: 13px/1.45 inherit; resize: vertical; min-height: 36px;
  }
  #sys-btn.on { color: var(--accent); border-color: var(--accent); }
  .composer .seg-btn { min-height: 42px; padding: 6px 10px; }

  #log {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 18px clamp(12px, 3vw, 20px) 14px;
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; max-width: var(--col); margin: 0 auto;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  #log::-webkit-scrollbar { width: 10px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px;
                                  border: 2px solid var(--bg); }
  #log::-webkit-scrollbar-thumb:hover { filter: brightness(1.2); }

  .msg {
    max-width: min(78%, 720px); padding: 9px 13px; border-radius: 12px;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    animation: rise .18s ease-out;
  }
  .msg.user {
    align-self: flex-end; background: var(--user-bubble); color: var(--user-bubble-text);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    position: relative;
    align-self: flex-start; background: var(--panel);
    border: 1px solid var(--border-soft); border-bottom-left-radius: 4px;
    padding-bottom: 30px;   /* reserva o canto para o botão copiar */
    white-space: normal;   /* o markdown já resolve as quebras (\n → <br>) */
  }
  .copy-btn {
    position: absolute; bottom: 4px; inset-inline-end: 4px;
    width: 24px; height: 24px; min-height: 24px; padding: 0;
    display: grid; place-items: center;
    border: 1px solid var(--border-soft); background: var(--panel-2);
    border-radius: 7px; color: var(--dim);
    opacity: 0; transition: opacity .15s;
  }
  .copy-btn svg { display: block; }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .msg.assistant:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
  .copy-btn.done { color: var(--ok); border-color: var(--ok); opacity: 1; }
  .retry-btn { inset-inline-end: 32px; }   /* ↻ ao lado do copiar */
  .msg h2, .msg h3, .msg h4, .msg h5 { margin: 10px 0 4px; line-height: 1.3; }
  .msg ul, .msg ol { margin: 6px 0; padding-inline-start: 22px; }
  .msg li { margin: 2px 0; }
  .msg blockquote {
    margin: 8px 0; padding: 4px 12px; color: var(--dim);
    border-inline-start: 3px solid var(--border);
  }
  .msg hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
  .msg a { color: var(--accent); }
  .tblwrap { overflow-x: auto; margin: 8px 0; scrollbar-width: thin; }
  .msg table { border-collapse: collapse; font-size: 13px; }
  .msg th, .msg td {
    border: 1px solid var(--border); padding: 4px 9px; text-align: start;
  }
  .msg th { background: var(--code-bg); }
  .mermaid-box {
    margin: 8px 0 2px; padding: 10px; overflow-x: auto;
    background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 8px;
    text-align: center;
  }
  .mermaid-box svg { max-width: 100%; height: auto; }
  .katex-src.mdisp { display: block; text-align: center; margin: 8px 0; overflow-x: auto; }
  .katex { font-size: 1.05em; }
  pre.mermaid-src { outline: 1px dashed var(--border); }
  pre.mermaid-src.mermaid-error { outline-color: var(--bad); }
  .sugg { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .sugg button {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: var(--code-bg); border: 1px solid var(--border); color: var(--dim);
  }
  .sugg button:hover { color: var(--text); border-color: var(--accent); }
  .sugg .katex { font-size: 1em; }
  .sugg .katex-src.mdisp { display: inline; }
  .note-btn { font-size: 11.5px; padding: 2px 9px; border-radius: 6px; }
  .msg code {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--code-bg); border: 1px solid var(--code-border);
    border-radius: 5px; padding: 1px 5px;
  }
  .msg pre {
    margin: 8px 0 2px; padding: 10px 12px; overflow-x: auto;
    background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 8px;
    scrollbar-width: thin;
  }
  .msg pre code { background: none; border: 0; padding: 0; font-size: 12.5px;
                  white-space: pre; }

  .sysnote {
    align-self: center; color: var(--warn); font-size: 12px; text-align: center;
    max-width: min(90%, 640px);
  }

  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim);
            animation: pulse 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: translateY(0); }
                     50% { opacity: 1; transform: translateY(-3px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); }
                    to { opacity: 1; transform: none; } }

  /* estado vazio */
  .empty { margin: auto; text-align: center; color: var(--dim); max-width: 560px; }
  .empty .logo { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 14px; }
  .empty h2 { font-size: 15px; color: var(--text); margin: 0 0 4px; font-weight: 600; }
  .empty p { margin: 0 0 16px; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    color: var(--dim); font-size: 12.5px; padding: 7px 14px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }

  /* botão “ir ao fim” */
  #jump {
    position: fixed; z-index: 5; bottom: 92px;
    right: max(18px, calc(50vw - var(--col) / 2 + 18px));
    width: 38px; height: 38px; border-radius: 50%; padding: 0;
    background: var(--panel-2); border: 1px solid var(--border);
    box-shadow: var(--shadow); font-size: 16px; line-height: 1;
  }

  /* círculo de carregamento (resposta em andamento) */
  .spinner {
    position: fixed; z-index: 5; bottom: 92px;
    right: max(66px, calc(50vw - var(--col) / 2 + 66px));
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    background: var(--panel);
    box-shadow: var(--shadow);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── rodapé ────────────────────────────────────────────────────────── */
  footer {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 12px clamp(12px, 3vw, 20px) calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border-top: 1px solid var(--border-soft);
    backdrop-filter: blur(6px);
  }
  footer .composer {
    display: flex; gap: 10px; align-items: flex-end;
    width: var(--col); max-width: var(--col); margin: 0 auto;
  }
  #prompt {
    flex: 1; background: var(--code-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 13px; font: inherit; resize: none;
    min-height: 44px; max-height: 200px;
  }
  #prompt:focus { outline: none; border-color: var(--accent);
                  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  #prompt::placeholder { color: var(--placeholder); }
  #send { width: 46px; min-width: 46px; height: 44px; min-height: 44px; padding: 0; }
  #send.stopping { color: var(--bad); border-color: var(--bad); }
  .note-btn {
    width: 24px; height: 24px; padding: 0;
    display: inline-grid; place-items: center; vertical-align: middle;
  }

  /* ── responsivo ────────────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .meter { order: 3; flex-basis: 100%; max-width: none; margin-left: 0; }
    .actions { order: 4; }
    .msg { max-width: 88%; }
    .brand h1 { font-size: 13px; }
    .actions button, .actions select { padding: 6px 9px; font-size: 12px; }
    .actions .icon-btn { width: 32px; height: 32px; padding: 0; }
    .composer { flex-wrap: wrap; }
    .composer .seg { order: 5; width: 100%; }
    .composer .seg-btn { flex: 1; min-height: 38px; }
    #jump { bottom: 108px; right: 16px; }
    .spinner { bottom: 108px; right: 60px; }
  }
  @media (pointer: coarse) {
    button, .chip, select { min-height: 40px; }
    .sysnote .note-btn { min-height: 26px; width: 26px; }
    .copy-btn { opacity: 1; min-height: 28px; width: 28px; height: 28px; }
    .retry-btn { inset-inline-end: 36px; }
    #prompt { min-height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="logo" src="verbolog.svg" alt="Logo VerboLang">
    <div class="brand-text">
      <h1>VerboLang</h1>
      <div class="sub"><span class="dot" id="dot"></span><span id="who">…</span></div>
    </div>
  </div>
  <div class="meter" id="meter" aria-label="contexto">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="lbl" id="meter-lbl">—</div>
  </div>
  <div class="actions">
    <button id="theme-btn" class="icon-btn" title=""></button>
    <button id="lang-btn" class="icon-btn" title=""></button>
    <button id="rollback" class="icon-btn" title=""></button>
    <button id="prune" class="icon-btn" title=""></button>
    <button id="clear" class="icon-btn" title=""></button>
  </div>
</header>

<nav id="tabs" aria-label=""></nav>

<main id="log" aria-live="polite" aria-label="">
  <div class="empty" id="empty">
    <img class="logo" src="verbolog.svg" alt="">
    <h2 id="empty-title"></h2>
    <p id="empty-desc"></p>
    <div class="chips" id="chips" role="list"></div>
  </div>
</main>

<button id="jump" hidden>↓</button>
<div id="spinner" class="spinner" hidden role="status"></div>

<footer>
  <div id="sys-panel" hidden>
    <span class="sheet-status" id="sheet-status"></span>
    <textarea id="system" rows="2"></textarea>
  </div>
  <div class="composer">
    <div class="seg" role="group" id="mode-group">
      <button class="seg-btn" id="mode-puro" aria-pressed="true"></button>
      <button class="seg-btn" id="mode-vbl" aria-pressed="false"></button>
    </div>
    <button id="sys-btn" class="icon-btn" title=""></button>
    <textarea id="prompt" rows="1" aria-label=""></textarea>
    <button id="send" class="icon-btn send-btn" title=""></button>
  </div>
</footer>

<script src="vendor/mermaid.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script>
"use strict";
// ── configuração (fragmento #k=…&u=…&m=…&c=…) ─────────────────────────────
const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const API_KEY = hash.get("k") || localStorage.getItem("vllm.key") || "";
const API_URL = hash.get("u") || localStorage.getItem("vllm.url") || "http://127.0.0.1:8000/v1";
const MODEL   = hash.get("m") || localStorage.getItem("vllm.model") || "qwen3-4b";
const CTX     = parseInt(hash.get("c") || localStorage.getItem("vllm.ctx") || "4096", 10);
if (API_KEY) localStorage.setItem("vllm.key", API_KEY);
localStorage.setItem("vllm.url", API_URL);
localStorage.setItem("vllm.model", MODEL);
localStorage.setItem("vllm.ctx", String(CTX));

// ── i18n ───────────────────────────────────────────────────────────────────
const I18N = {
  pt: {
    name: "Português", dir: "ltr",
    t: {
      docTitle: "VerboLang · Consulta",
      whoConnecting: "conectando…", whoOk: "{model} · conectado",
      whoHttp: "{model} · HTTP {code}", whoDown: "{model} · servidor inacessível",
      meterEst: "contexto ≈ {est} / {ctx} tokens · estimativa",
      meterReal: "contexto ≈ {est} / {ctx} tokens · uso real do último turno",
      welcome: "Teto de contexto: {ctx} tokens (prompt + resposta). O medidor mostra onde você está.",
      btnPrune: "✂ Podar", btnPruneTitle: "Remove o par (pergunta, resposta) mais antigo da conversa",
      btnClear: "Nova", btnClearTitle: "Nova conversa (zera o contexto)",
      btnSend: "Enviar", btnStop: "Parar",
      promptPlaceholder: "Escreva sua pergunta…  (Enter envia · Shift+Enter quebra linha · Esc para)",
      summarySystem: "prompt de sistema",

// ── estado & sessões (abas) ────────────────────────────────────────────────
let inFlight = null;         // AbortController da geração corrente (global)
let genSession = null;       // sessão dona da geração corrente
let vblMode = localStorage.getItem("vllm.vbl") === "1"; // + VerboLang?
let sheetText = "";          // cheat sheet da linguagem (docs/VBL-CHEATSHEET.md)
let lastQuery = "";          // última pergunta enviada (para retry)
const sessions = [];         // sessões abertas (abas)
let S = null;                // sessão ativa
let seq = 0;                 // numeração das conversas

const $ = (id) => document.getElementById(id);
const log = $("log");
const fmt = (n) => n.toLocaleString(lang === "pt" ? "pt-BR" : lang);

// cada sessão: history (mensagens), lastTokens (uso real), stick (autoscroll),
// view (DOM próprio — as mensagens nunca se misturam entre abas)
function sessionTitle(sess) {
  return sess.userTitle || t("tabDefault", { n: sess.id });
}
function makeSession() {
  const view = document.createElement("div");
  view.className = "session-view";
  const sess = {
    id: ++seq, userTitle: null, history: [], lastTokens: null,
    stick: true, view, scrollTopSave: 0
  };
  view.addEventListener("scroll", () => {
    if (S !== sess) return;
    sess.stick = view.scrollHeight - view.scrollTop - view.clientHeight < 80;
    $("jump").hidden = sess.stick;
  });
  log.appendChild(view);
  sessions.push(sess);
  activateSession(sess);
  return sess;
}
function activateSession(sess) {
  if (S === sess) { renderTabs(); return; }
  if (S) {
    S.scrollTopSave = S.view.scrollTop;
    S.view.style.display = "none";
  }
  S = sess;
  sess.view.style.display = "flex";
  if (sess.stick) sess.view.scrollTop = sess.view.scrollHeight;
  else sess.view.scrollTop = sess.scrollTopSave || 0;
  $("jump").hidden = sess.stick;
  refreshEmpty();
  renderMeter();
  renderTabs();
}
function closeSession(sess) {
  if (inFlight && genSession === sess) inFlight.abort();
  const i = sessions.indexOf(sess);
  if (i === -1) return;
  sess.view.remove();
  sessions.splice(i, 1);
  if (!sessions.length) { makeSession(); return; }  // sempre há uma aberta
  if (S === sess) activateSession(sessions[Math.max(0, i - 1)]);
  else renderTabs();
}
function renderTabs() {
  const nav = $("tabs");
  nav.replaceChildren(...sessions.map((sess) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(sess === S));
    b.title = sessionTitle(sess);
    const label = document.createElement("span");
    label.className = "tab-label";
    label.textContent = sessionTitle(sess);
    const x = document.createElement("span");
    x.className = "tab-x"; x.textContent = "×";
    x.title = t("tabCloseTitle");
    x.addEventListener("click", (e) => { e.stopPropagation(); closeSession(sess); });
    b.append(label, x);
    b.addEventListener("click", () => activateSession(sess));
    return b;
  }));
  const plus = document.createElement("button");
  plus.type = "button"; plus.className = "tab tab-new"; plus.textContent = "+";
  plus.title = t("tabNewTitle");
  plus.setAttribute("aria-label", t("tabNewTitle"));
  plus.addEventListener("click", () => { makeSession(); $("prompt").focus(); });
  nav.appendChild(plus);
}

// ── medidor de contexto (honestidade termodinâmica) ───────────────────────
function estimateTokens(text) { return Math.ceil((text || "").length / 4); }
function sheetTokens() { return vblMode && sheetText ? estimateTokens(sheetText) : 0; }
function contextEstimate(sess = S) {
  if (!sess) return 0;
  return estimateTokens($("system").value) + 16 + sheetTokens()
    + estimateTokens(t("followupInstr"))
    + (vblMode ? estimateTokens(t("followupVbl")) : 0)
    + estimateTokens(t("followupReminder"))
    + sess.history.reduce(
      (acc, msg) => acc + estimateTokens(msg.content) + 4, 0);
}
function systemContent() {
  const extra = $("system").value.trim();
  const parts = [];
  if (vblMode && sheetText) parts.push(sheetText.trim());
  if (extra) {
    parts.push(vblMode && sheetText
      ? t("extraInstr") + "\n" + extra
      : extra);
  }
  if (vblMode) parts.push(t("followupVbl"));
  parts.push(t("followupInstr"));
  return parts.join("\n\n---\n\n")
    || t("sysDefault");
}

// ── perguntas sugeridas: bloco [q]…[/q] no fim da resposta vira botões ────
function cutAtQ(s) {
  const a = s.indexOf("[q]");
  const b = s.indexOf("[/q]");
  const i = a === -1 ? b : (b === -1 ? a : Math.min(a, b));
  return i === -1 ? s : s.slice(0, i);
}
function splitSuggestions(raw) {
  let i = raw.lastIndexOf("[q]");
  let bodyStart = i + 3;
  if (i === -1) {
    // modelo esqueceu o [q] de abertura (falha comum em modelos pequenos):
    // aceita [/q] órfão — resposta antes, perguntas depois
    const j = raw.lastIndexOf("[/q]");
    if (j === -1) return { clean: raw, items: [] };
    i = j; bodyStart = j + 4;
  }
  const head = raw.slice(0, i);
  const tail = raw.slice(bodyStart);
  const end = tail.indexOf("[/q]");
  const body = end === -1 ? tail : tail.slice(0, end);
  const items = body.split("\n")
    .map((l) => l.replace(/^\s*(?:\d+[.)]|[-*])?\s*/, "").trim())
    .filter(Boolean)
    .filter((l) => !/^\[\/?q\]?$/.test(l))
    .slice(0, 7);
  return { clean: head.replace(/\s+$/, ""), items };
}
function renderSugg(bubble, items) {
  const box = document.createElement("div");
  box.className = "sugg";
  for (const q of items) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = inline(stripLatex(q));   // mesmo pipeline das mensagens
    b.addEventListener("click", () => {
      if (inFlight) return;
      $("prompt").value = q; autosize(); $("prompt").focus();  // raw no campo
    });
    box.appendChild(b);
  }
  bubble.appendChild(box);
  enhanceMath(box);                         // LaTeX dentro dos chips
}
function parseQuestionList(text) {           // saída da chamada de recuperação
  return (text || "").split("\n")
    .map((l) => l.replace(/^\s*(?:\d+[.)]|[-*])?\s*/, "").trim())
    .filter(Boolean)
    .filter((l) => !/^\[\/?q\]?$/.test(l))
    .slice(0, 7);
}
function recoverSuggestions(bubble, answerText) {
  if (!API_KEY || !answerText) return;
  const sys = t("followupRecovery") + (vblMode ? "\n" + t("followupVbl") : "");
  const sp = $("spinner");
  sp.setAttribute("aria-label", t("loading"));
  sp.hidden = false;                          // 2ª chamada também é trabalho
  fetch(API_URL + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
    body: JSON.stringify({
      model: MODEL,
      messages: [
        { role: "system", content: sys },
        { role: "user", content: answerText.slice(-2400) } // cauda da resposta
      ],
      max_tokens: 256,
      temperature: 0.6,
      stream: false
    })
  }).then((r) => r.ok ? r.json() : null).then((j) => {
    if (!j || !bubble.isConnected) return;    // bolha já foi embora (rollback etc.)
    const items = parseQuestionList(j.choices?.[0]?.message?.content || "");
    if (items.length) renderSugg(bubble, items);
  }).catch(() => {}).finally(() => {
    if (!inFlight) sp.hidden = true;          // não apague o da geração corrente
  });
}
function renderMeter() {
  if (!S) return;
  const est = Math.max(contextEstimate(S), S.lastTokens ?? 0);
  const pct = Math.min(100, (est / CTX) * 100);
  const fill = $("fill");
  fill.style.width = pct.toFixed(1) + "%";
  fill.style.background = pct > 85 ? "var(--bad)"
                        : pct > 65 ? "var(--warn)"
                        : "linear-gradient(90deg, var(--accent), var(--ok))";
  $("meter-lbl").textContent = t(S.lastTokens ? "meterReal" : "meterEst",
                                 { est: fmt(est), ctx: fmt(CTX) });
}
let statusState = "", statusKey = "whoConnecting", statusParams = {};
function setStatus(state, key, params) {
  statusState = state; statusKey = key; statusParams = params || {};
  $("dot").className = "dot " + statusState;
  $("who").textContent = t(statusKey, statusParams);
}
function note(text, sess = S) {
  if (!sess) return;
  const div = document.createElement("div");
  div.className = "sysnote"; div.textContent = text;
  sess.view.appendChild(div);
  sess.stick = true; scrollToBottom(sess);
}
function noteAction(text, label, onClick, sess = S) {   // nota com botão (ex.: Reenviar)
  if (!sess) return;
  const div = document.createElement("div");
  div.className = "sysnote";
  div.appendChild(document.createTextNode(text + " "));
  const b = document.createElement("button");
  b.type = "button"; b.className = "note-btn"; b.innerHTML = ICON_RETRY;
  b.title = label; b.setAttribute("aria-label", label);
  b.addEventListener("click", onClick);
  div.appendChild(b);
  sess.view.appendChild(div);

// ── markdown (escape primeiro; blocos: código, mermaid, título, tabela,
//    lista, citação, hr; inline: código, negrito, itálico, tachado, link) ──
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => {          // protege o conteúdo do código
    codes.push(c);
    return "\x00" + (codes.length - 1) + "\x00";
  });
  const maths = [];                                 // protege a matemática
  s = s.replace(/([\x03\x05])([^\x03\x05]+)\1/g, (_, d, tex) => {
    maths.push({ tex, disp: d === "\x05" });
    return "\x04" + (maths.length - 1) + "\x04";
  });
  s = s
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\x00(\d+)\x00/g, (_, i) => "<code>" + codes[+i] + "</code>");
  return s.replace(/\x04(\d+)\x04/g, (_, i) =>      // placeholder → KaTeX
    '<span class="katex-src' + (maths[+i].disp ? " mdisp" : "") + '">' +
    maths[+i].tex + "</span>");
}
// ── LaTeX vazado (\( \), \[ \], $$ $$) → KaTeX local (fallback: TeX cru) ──
function stripLatex(src) {
  const mk = (ch) => (_, m) => ch + m.replace(/\s+/g, " ").trim() + ch;
  return src
    .replace(/\\\(([\s\S]*?)\\\)/g, mk("\x03"))   // inline
    .replace(/\\\[([\s\S]*?)\\\]/g, mk("\x05"))   // display
    .replace(/\$\$([\s\S]*?)\$\$/g, mk("\x05"));
}
function md(src) {
  // protege cercas de código do tratamento LaTeX (durante o streaming,
  // cerca não fechada protege até o fim)
  const fences = [];
  src = src.replace(/\r\n?/g, "\n").replace(/```[\s\S]*?(?:```|$)/g, (m0) => {
    fences.push(m0);
    return "\x02" + (fences.length - 1) + "\x02";
  });
  src = stripLatex(src);
  src = src.replace(/\x02(\d+)\x02/g, (_, i) => fences[+i]);
  const lines = src.split("\n");
  const out = [];
  let para = [];
  let i = 0;
  const flushPara = () => {
    if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; }
  };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*(```+|~~~+)\s*(\S*)\s*$/);
    if (fence) {                                    // bloco cercado (e mermaid)
      flushPara();
      const lang = (fence[2] || "").toLowerCase();
      const buf = []; i++;
      while (i < lines.length && !/^\s*(```+|~~~+)\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      const code = buf.join("\n");
      out.push(lang === "mermaid"
        ? '<pre class="mermaid-src">' + esc(code) + "</pre>"
        : "<pre><code>" + esc(code) + "</code></pre>");
      continue;
    }
    if (/^\s*$/.test(line)) { flushPara(); i++; continue; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {                                        // título → h2..h5 (h1 é da página)
      flushPara();
      const l = h[1].length + 1;
      out.push("<h" + l + ">" + inline(h[2]) + "</h" + l + ">");
      i++; continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(line)) {                       // citação
      flushPara();
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote>" + buf.map(inline).join("<br>") + "</blockquote>");
      continue;
    }
    if (line.includes("|") && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      flushPara();                                  // tabela
      const row = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inline(c.trim()));
      const head = row(line); i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && !/^\s*$/.test(lines[i])) { rows.push(row(lines[i])); i++; }
      let tbl = '<div class="tblwrap"><table><thead><tr>' +
                head.map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
      for (const r of rows) tbl += "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>";
      out.push(tbl + "</tbody></table></div>");
      continue;
    }
    const li = line.match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
    if (li) {                                       // lista (1 nível + continuação)
      flushPara();
      const ordered = /\d/.test(li[2]);
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
        if (!m) break;
        items.push(m[3]); i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+[.)])\s/.test(lines[i])) {
          items[items.length - 1] += " " + lines[i].trim(); i++;
        }
      }
      const tag = ordered ? "ol" : "ul";
      out.push("<" + tag + ">" + items.map((x) => "<li>" + inline(x) + "</li>").join("") + "</" + tag + ">");
      continue;
    }
    para.push(line); i++;
  }
  flushPara();
  return out.join("");
}

// ── mermaid (vendor local; tema acompanha a UI; falha deixa o código) ─────
let mermaidSeq = 0;
const diagrams = [];   // {box, code} — para re-render quando o tema muda
function mermaidThemeName() { return theme === "light" ? "neutral" : "dark"; }
function applyMermaidTheme() {
  if (!window.mermaid) return;
  mermaid.initialize({
    startOnLoad: false, securityLevel: "strict",
    theme: mermaidThemeName(), fontFamily: "Inter, system-ui, sans-serif"
  });
  for (const d of diagrams) {
    mermaid.render("mmd-" + (++mermaidSeq), d.code)
      .then(({ svg }) => { d.box.innerHTML = svg; })
      .catch(() => {});
  }
}
async function enhanceMermaid(scope) {
  if (!window.mermaid) return;
  for (const pre of scope.querySelectorAll("pre.mermaid-src")) {
    const code = pre.textContent;
    try {
      const { svg } = await mermaid.render("mmd-" + (++mermaidSeq), code);
      const box = document.createElement("div");
      box.className = "mermaid-box";
      box.innerHTML = svg;
      pre.replaceWith(box);
      diagrams.push({ box, code });
    } catch {
      pre.classList.add("mermaid-error");  // diagrama inválido: o código fica visível
    }
  }
}
function enhanceMath(scope) {                // KaTeX: TeX cru se falhar
  if (!window.katex) return;
  for (const el of scope.querySelectorAll(".katex-src")) {
    if (el.dataset.rendered) continue;
    try {
      katex.render(el.textContent, el, {
        throwOnError: true,
        displayMode: el.classList.contains("mdisp")
      });
      el.dataset.rendered = "1";
    } catch { /* TeX inválido: o texto bruto permanece */ }
  }
}
function renderAssistant(bubble, text, sess = S) {

    bubble.innerHTML = '<span class="dots" aria-label="…"><i></i><i></i><i></i></span>';
  } else {

  keepScroll(sess);
}

// ── chamada ao vLLM (streaming SSE) ────────────────────────────────────────
function send() {
  const box = $("prompt");
  const text = box.value.trim();
  if (!text) return;
  if (inFlight) { note(t("busy")); return; }
  if (!API_KEY) { note(t("noKey")); return; }
  const promptEst = contextEstimate() + estimateTokens(text);
  if (promptEst > CTX - 64) {
    note(t("overflow", { est: fmt(promptEst), ctx: fmt(CTX) }));
    return;
  }
  box.value = ""; autosize();
  ask(text);
}
async function ask(text, sess = S) {
  if (inFlight || !sess) return;
  lastQuery = text;
  genSession = sess;
  const maxTokens = Math.max(64, Math.min(2048,
    CTX - contextEstimate(sess) - estimateTokens(text) - 256));

  sess.history.push({ role: "user", content: text });
  if (sess.history.length === 1) {           // a 1ª pergunta batiza a aba
    sess.userTitle = text.length > 30 ? text.slice(0, 30) + "…" : text;
    renderTabs();
  }
  addBubble("user", text, sess);
  $("empty").style.display = "none";
  // lembrete do bloco [q] vai só na requisição: history/cópia ficam limpos
  const reqHistory = sess.history.concat();
  const lastReq = reqHistory[reqHistory.length - 1];
  if (lastReq && lastReq.role === "user") {
    reqHistory[reqHistory.length - 1] = {
      role: "user",
      content: lastReq.content + "\n\n(" + t("followupReminder") + ")"
    };
  }

  const bubble = document.createElement("div");
  bubble.className = "msg assistant";
  sess.view.appendChild(bubble);
  renderAssistant(bubble, "", sess);
  const sp = $("spinner");
  sp.setAttribute("aria-label", t("loading"));
  sp.hidden = false;

  const controller = new AbortController();
  inFlight = controller;
  updateSendButton();
  let acc = "";
  try {
    const resp = await fetch(API_URL + "/chat/completions", {
      method: "POST",
      signal: controller.signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: "system", content: systemContent() }, ...reqHistory],
        stream: true,
        stream_options: { include_usage: true },
        max_tokens: maxTokens,
        temperature: 0.7
      })
    });
    if (!resp.ok) {
      const body = await resp.text().catch(() => "");
      throw new Error(friendlyError(resp.status, body));
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        let evt; try { evt = JSON.parse(payload); } catch { continue; }
        if (evt.usage) {
          sess.lastTokens = evt.usage.prompt_tokens + (evt.usage.completion_tokens || 0);
        }
        const delta = evt.choices?.[0]?.delta?.content;
        if (delta) { acc += delta; renderAssistant(bubble, cutAtQ(acc), sess); }
      }
    }
    if (!acc) { acc = t("emptyReply"); bubble.textContent = acc; }
    const { clean, items } = splitSuggestions(acc);
    if (items.length) renderAssistant(bubble, clean, sess);  // resposta sem o bloco
    sess.history.push({ role: "assistant", content: clean });
    if (items.length) renderSugg(bubble, items);
    else recoverSuggestions(bubble, clean);     // modelo esqueceu: 2ª chamada
    enhanceMermaid(bubble);
    enhanceMath(bubble);
    attachCopy(bubble, clean);
    markLastAnswer(bubble, text, sess);
  } catch (err) {
    if (controller.signal.aborted) {
      if (acc) {
        const { clean, items } = splitSuggestions(acc);
        renderAssistant(bubble, clean, sess);
        sess.history.push({ role: "assistant", content: clean });
        if (items.length) renderSugg(bubble, items);
        enhanceMermaid(bubble);
        enhanceMath(bubble);
        attachCopy(bubble, clean);
        markLastAnswer(bubble, text, sess);
      }
      else bubble.remove();
      note(t("aborted"), sess);
    } else {
      bubble.remove();
      sess.history.pop(); // a pergunta sai do histórico — o turno não aconteceu
      if (err instanceof TypeError) setStatus("err", "whoDown", { model: MODEL });
      noteAction(t("failed", { msg: err.message || err }), t("retry"), () => {
        lastBubble("user", sess)?.remove();
        refreshEmpty(); renderMeter();
        ask(lastQuery, sess);
      }, sess);
    }
  } finally {
    inFlight = null;
    genSession = null;
    $("spinner").hidden = true;
    updateSendButton();
    box.focus();
    renderMeter();
    keepScroll(sess);
  }
}
function friendlyError(status, body) {
  if (status === 401) return t("err401");
  if (status === 400 && /input_tokens|context length/i.test(body))
    return t("err400", { ctx: fmt(CTX) });
  return status + " — " + body.slice(0, 200);
}

  const box = $("prompt");
  box.style.height = "auto";
  box.style.height = Math.min(200, box.scrollHeight) + "px";
}

// ── alternância modelo puro ↔ + VerboLang ──────────────────────────────────
function setVblMode(on) {
  vblMode = on;
  localStorage.setItem("vllm.vbl", on ? "1" : "0");
  $("mode-puro").setAttribute("aria-pressed", String(!on));
  $("mode-vbl").setAttribute("aria-pressed", String(on));
  renderChips();          // as perguntas da home acompanham o modo
  renderMeter();          // o custo do cheat sheet entra no medidor
}
$("mode-puro").addEventListener("click", () => setVblMode(false));
$("mode-vbl").addEventListener("click", () => setVblMode(true));
$("sys-btn").addEventListener("click", () => {   // painel do prompt de sistema
  const p = $("sys-panel");
  p.hidden = !p.hidden;
  $("sys-btn").classList.toggle("on", !p.hidden);
  if (!p.hidden) $("system").focus();
});
let sheetState = "loading";
function updateSheetStatus() {
  const el = $("sheet-status");
  if (sheetState === "loading") { el.textContent = "…"; return; }
  if (sheetState === "missing") { el.textContent = t("sheetMissing"); return; }
  el.textContent = t("sheetTokens", { n: fmt(estimateTokens(sheetText)) });
}
async function loadSheet() {
  const candidates = ["../docs/VBL-CHEATSHEET.md", "docs/VBL-CHEATSHEET.md", "VBL-CHEATSHEET.md"];
  for (const path of candidates) {
    try {
      const r = await fetch(path);
      if (r.ok) { sheetText = await r.text(); break; }
    } catch { /* tenta o próximo */ }
  }
  sheetState = sheetText ? "ok" : "missing";
  if (sheetState === "missing") {
    $("mode-vbl").disabled = true;
    if (vblMode) setVblMode(false);
  }
  updateSheetStatus();
}

// ── eventos ────────────────────────────────────────────────────────────────
$("send").addEventListener("click", () => {   // botão único: envia ou para
  if (inFlight) inFlight.abort(); else send();
});
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && inFlight) inFlight.abort();
});
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("prompt").addEventListener("input", autosize);
$("system").addEventListener("input", renderMeter);
$("theme-btn").addEventListener("click", () =>
  applyTheme(THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length]));
$("lang-btn").addEventListener("click", () => {   // cicla os 7 idiomas
  const order = Object.keys(I18N);
  lang = order[(order.indexOf(lang) + 1) % order.length];
  applyLang();
});
$("clear").addEventListener("click", () => {
  if (!S) return;
  if (inFlight) inFlight.abort();
  S.history.length = 0; S.lastTokens = null; S.userTitle = null;
  [...S.view.querySelectorAll(".msg, .sysnote")].forEach((el) => el.remove());
  refreshEmpty();
  note(t("newChat"), S);
  renderMeter();
  renderTabs();
  $("prompt").focus();
});
$("rollback").addEventListener("click", rollbackLast);
$("prune").addEventListener("click", () => {
  if (!S) return;
  if (inFlight) inFlight.abort();
  const firstPair = S.view.querySelectorAll(".msg");
  if (S.history.length >= 2) {
    S.history.splice(0, 2);
    if (firstPair.length >= 2) { firstPair[0].remove(); firstPair[1].remove(); }
    S.lastTokens = null;
    note(t("pruned"), S);
  } else note(t("nothingToPrune"), S);
  refreshEmpty();
  renderMeter();
});

// ── partida ────────────────────────────────────────────────────────────────
(async function boot() {
  applyTheme(theme);
  if (!localStorage.getItem("vllm.sysinit")) {
    $("system").value = t("sysDefault");
    localStorage.setItem("vllm.sysinit", "1");
  }
  applyLang();
  makeSession();               // primeira aba
  setVblMode(vblMode);
  autosize();
  try {
    const r = await fetch(API_URL + "/models", { headers: { "Authorization": "Bearer " + API_KEY } });
    if (r.ok) setStatus("ok", "whoOk", { model: MODEL });
    else setStatus("err", "whoHttp", { model: MODEL, code: r.status });
  } catch {
    setStatus("err", "whoDown", { model: MODEL });
  }
  loadSheet();
  renderMeter();
  note(t("welcome", { ctx: fmt(CTX) }));
  $("prompt").focus();
})();
</script>
</body>
</html>
