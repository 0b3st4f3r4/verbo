<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VerboLang · Consulta local</title>
<link rel="icon" type="image/svg+xml" href="verbolog.svg">
<!--
  chat-local.html — UI de consulta direta ao modelo local (vLLM :8000).
  Single-file, sem dependências: streaming SSE via fetch, markdown mínimo
  (blocos de código, `inline`, **negrito**) com escape prévio — seguro por
  construção. Aberta automaticamente por scripts/serve-local-llm.sh.

  Configuração por fragmento da URL (não vai em logs de servidor):
    #k=<api-key>&u=<base-url>&m=<modelo>&c=<ctx>
  Marca do projeto: verbolog.svg (logo + favicon).
  Parte do projeto VerboLang — licenciado sob a GNU GPL-3.0 (ver LICENSE).
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1319; --bg-soft: #12181f; --panel: #171d24; --panel-2: #1b232c;
    --border: #29323e; --border-soft: #212a34; --text: #dde6f0; --dim: #8fa1b5;
    --accent: #4da3ff; --ok: #3fb96f; --warn: #e0a83a; --bad: #e05c5c;
    --mono: ui-monospace, "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
    --col: min(100%, 900px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    font: 15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 500px at 50% -10%, #16202b 0%, var(--bg) 55%) fixed, var(--bg);
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }

  /* ── cabeçalho ─────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px clamp(12px, 3vw, 20px);
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border-bottom: 1px solid var(--border-soft);
    backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 34px; height: 34px; display: block; border-radius: 9px; flex: none; }
  .brand h1 { font-size: 14px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .brand .sub { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none;
         transition: background .3s; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px color-mix(in srgb, var(--ok) 70%, transparent); }
  .dot.err { background: var(--bad); }

  .meter { flex: 1 1 200px; max-width: 340px; margin-left: auto; }
  .meter .bar { height: 6px; background: var(--border-soft); border-radius: 3px; overflow: hidden; }
  .meter .fill { height: 100%; width: 0%; border-radius: 3px;
                 background: linear-gradient(90deg, var(--accent), var(--ok));
                 transition: width .35s ease; }
  .meter .lbl { font-size: 11px; color: var(--dim); margin-top: 3px; text-align: right;
                font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: 8px; }

  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 13px; cursor: pointer; font-size: 13px;
    transition: border-color .15s, background .15s, transform .05s;
  }
  button:hover { border-color: var(--accent); background: #202a35; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button:focus-visible, textarea:focus-visible, summary:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ── área da conversa ──────────────────────────────────────────────── */
  #system-box { padding: 8px clamp(12px, 3vw, 20px) 0; }
  .mode-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg {
    display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; background: var(--panel);
  }
  .seg-btn {
    border: 0; border-radius: 0; background: transparent;
    padding: 6px 12px; font-size: 12.5px; color: var(--dim);
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--border-soft); }
  .seg-btn[aria-pressed="true"] { background: var(--panel-2); color: var(--accent); font-weight: 600; }
  .sheet-status { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #system-box details { color: var(--dim); font-size: 13px; }
  #system-box summary { cursor: pointer; user-select: none; width: fit-content; }
  #system-box textarea {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border-soft); border-radius: 8px;
    padding: 7px 10px; font: 13px/1.45 inherit; resize: vertical; min-height: 36px;
    margin-top: 6px;
  }

  #log {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 18px clamp(12px, 3vw, 20px) 14px;
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; max-width: var(--col); margin: 0 auto;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  #log::-webkit-scrollbar { width: 10px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px;
                                  border: 2px solid var(--bg); }
  #log::-webkit-scrollbar-thumb:hover { background: #3a4656; }

  .msg {
    max-width: min(78%, 720px); padding: 9px 13px; border-radius: 12px;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    animation: rise .18s ease-out;
  }
  .msg.user {
    align-self: flex-end; background: #1d3a5f;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start; background: var(--panel);
    border: 1px solid var(--border-soft); border-bottom-left-radius: 4px;
    white-space: normal;   /* o markdown já resolve as quebras (\n → <br>) */
  }
  .msg p { margin: 0; }
  .msg code {
    font-family: var(--mono); font-size: 12.5px;
    background: #0d1116; border: 1px solid var(--border-soft);
    border-radius: 5px; padding: 1px 5px;
  }
  .msg pre {
    margin: 8px 0 2px; padding: 10px 12px; overflow-x: auto;
    background: #0d1116; border: 1px solid var(--border-soft); border-radius: 8px;
    scrollbar-width: thin;
  }
  .msg pre code { background: none; border: 0; padding: 0; font-size: 12.5px;
                  white-space: pre; }

  .sysnote {
    align-self: center; color: var(--warn); font-size: 12px; text-align: center;
    max-width: min(90%, 640px);
  }

  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim);
            animation: pulse 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: translateY(0); }
                     50% { opacity: 1; transform: translateY(-3px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); }
                    to { opacity: 1; transform: none; } }

  /* estado vazio */
  .empty { margin: auto; text-align: center; color: var(--dim); max-width: 560px; }
  .empty .logo { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 14px; }
  .empty h2 { font-size: 15px; color: var(--text); margin: 0 0 4px; font-weight: 600; }
  .empty p { margin: 0 0 16px; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    color: var(--dim); font-size: 12.5px; padding: 7px 14px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }

  /* botão “ir ao fim” */
  #jump {
    position: fixed; z-index: 5; bottom: 92px;
    right: max(18px, calc(50vw - var(--col) / 2 + 18px));
    width: 38px; height: 38px; border-radius: 50%; padding: 0;
    background: var(--panel-2); border: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,.35); font-size: 16px; line-height: 1;
  }

  /* ── rodapé ────────────────────────────────────────────────────────── */
  footer {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 12px clamp(12px, 3vw, 20px) calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border-top: 1px solid var(--border-soft);
    backdrop-filter: blur(6px);
  }
  footer .composer {
    display: flex; gap: 10px; align-items: flex-end;
    width: var(--col); max-width: var(--col); margin: 0 auto;
  }
  #prompt {
    flex: 1; background: #0d1116; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 13px; font: inherit; resize: none;
    min-height: 44px; max-height: 200px;
  }
  #prompt:focus { outline: none; border-color: var(--accent);
                  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  #prompt::placeholder { color: #5d7086; }
  #send { min-width: 84px; min-height: 44px; }
  #stop { min-height: 44px; }

  /* ── responsivo ────────────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .meter { order: 3; flex-basis: 100%; max-width: none; margin-left: 0; }
    .msg { max-width: 88%; }
    .brand h1 { font-size: 13px; }
    .actions button { padding: 7px 10px; font-size: 12px; }
    #jump { bottom: 108px; right: 16px; }
  }
  @media (pointer: coarse) {
    button, .chip { min-height: 40px; }
    #prompt { min-height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="logo" src="verbolog.svg" alt="Logo VerboLang">
    <div class="brand-text">
      <h1>Consulta local · VerboLang</h1>
      <div class="sub"><span class="dot" id="dot"></span><span id="who">conectando…</span></div>
    </div>
  </div>
  <div class="meter" aria-label="Uso do contexto">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="lbl" id="meter-lbl">contexto: —</div>
  </div>
  <div class="actions">
    <button id="prune" title="Remove o par (pergunta, resposta) mais antigo da conversa">✂ Podar</button>
    <button id="clear" title="Nova conversa (zera o contexto)">Nova</button>
  </div>
</header>

<div id="system-box">
  <div class="mode-row">
    <div class="seg" role="group" aria-label="Modo do modelo">
      <button class="seg-btn" id="mode-puro" aria-pressed="true">Modelo puro</button>
      <button class="seg-btn" id="mode-vbl" aria-pressed="false" title="Injeta o cheat sheet da VerboLang (docs/VBL-CHEATSHEET.md) como prompt de sistema">+ VerboLang</button>
    </div>
    <span class="sheet-status" id="sheet-status"></span>
  </div>
  <details>
    <summary>prompt de sistema</summary>
    <textarea id="system" rows="2">Você é um assistente objetivo. Responda em português do Brasil.</textarea>
  </details>
</div>

<main id="log" aria-live="polite" aria-label="Conversa">
  <div class="empty" id="empty">
    <img class="logo" src="verbolog.svg" alt="">
    <h2>Consulta direta ao modelo local</h2>
    <p>Tudo fica nesta máquina — nada sai dela. O medidor no topo mostra o quanto
       da janela de contexto você já usou.</p>
    <div class="chips" role="list">
      <button class="chip" role="listitem">Explique o operador subvert da VerboLang</button>
      <button class="chip" role="listitem">Escreva um stub Rust de parser EBNF</button>
      <button class="chip" role="listitem">Resuma o protocolo FXP em 5 tópicos</button>
    </div>
  </div>
</main>

<button id="jump" title="Ir para o fim da conversa" aria-label="Ir para o fim da conversa" hidden>↓</button>

<footer>
  <div class="composer">
    <textarea id="prompt" rows="1"
      placeholder="Escreva sua pergunta…  (Enter envia · Shift+Enter quebra linha · Esc para)"
      aria-label="Sua mensagem"></textarea>
    <button id="send">Enviar</button>
    <button id="stop" disabled>Parar</button>
  </div>
</footer>

<script>
"use strict";
// ── configuração (fragmento #k=…&u=…&m=…&c=…) ─────────────────────────────
const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
const API_KEY = hash.get("k") || localStorage.getItem("vllm.key") || "";
const API_URL = hash.get("u") || localStorage.getItem("vllm.url") || "http://127.0.0.1:8000/v1";
const MODEL   = hash.get("m") || localStorage.getItem("vllm.model") || "qwen3-4b";
const CTX     = parseInt(hash.get("c") || localStorage.getItem("vllm.ctx") || "4096", 10);
if (API_KEY) localStorage.setItem("vllm.key", API_KEY);
localStorage.setItem("vllm.url", API_URL);
localStorage.setItem("vllm.model", MODEL);
localStorage.setItem("vllm.ctx", String(CTX));

// ── estado ─────────────────────────────────────────────────────────────────
const history = [];          // [{role, content}] sem o system
let lastPromptTokens = null; // uso real informado pelo vLLM
let inFlight = null;         // AbortController da requisição corrente
let stickToBottom = true;    // autoscroll só quando o usuário está no fim
let vblMode = localStorage.getItem("vllm.vbl") === "1"; // + VerboLang?
let sheetText = "";          // cheat sheet da linguagem (docs/VBL-CHEATSHEET.md)

const $ = (id) => document.getElementById(id);
const log = $("log");
const fmt = (n) => n.toLocaleString("pt-BR");

// ── medidor de contexto (honestidade termodinâmica) ───────────────────────
function estimateTokens(text) { return Math.ceil((text || "").length / 4); }
function sheetTokens() { return vblMode && sheetText ? estimateTokens(sheetText) : 0; }
function contextEstimate() {
  return estimateTokens($("system").value) + 16 + sheetTokens() + history.reduce(
    (acc, msg) => acc + estimateTokens(msg.content) + 4, 0);
}
function systemContent() {
  const extra = $("system").value.trim();
  const parts = [];
  if (vblMode && sheetText) parts.push(sheetText.trim());
  if (extra) {
    parts.push(vblMode && sheetText
      ? "Instruções adicionais do operador:\n" + extra
      : extra);
  }
  return parts.join("\n\n---\n\n")
    || "Você é um assistente objetivo. Responda em português do Brasil.";
}
function renderMeter() {
  const est = Math.max(contextEstimate(), lastPromptTokens ?? 0);
  const pct = Math.min(100, (est / CTX) * 100);
  const fill = $("fill");
  fill.style.width = pct.toFixed(1) + "%";
  fill.style.background = pct > 85 ? "var(--bad)"
                        : pct > 65 ? "var(--warn)"
                        : "linear-gradient(90deg, var(--accent), var(--ok))";
  $("meter-lbl").textContent =
    `contexto ≈ ${fmt(est)} / ${fmt(CTX)} tokens` +
    (lastPromptTokens ? " · uso real do último turno" : " · estimativa");
}
function setStatus(state, text) {
  $("dot").className = "dot " + state;
  $("who").textContent = text;
}
function note(text) {
  const div = document.createElement("div");
  div.className = "sysnote"; div.textContent = text;
  log.appendChild(div);
  stickToBottom = true; scrollToBottom();
}
function refreshEmpty() { $("empty").style.display = history.length ? "none" : ""; }

// ── scroll ─────────────────────────────────────────────────────────────────
function scrollToBottom() { log.scrollTop = log.scrollHeight; }
log.addEventListener("scroll", () => {
  stickToBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  $("jump").hidden = stickToBottom;
});
$("jump").addEventListener("click", () => { stickToBottom = true; scrollToBottom(); });
function keepScroll() { if (stickToBottom) scrollToBottom(); }

// ── markdown mínimo (escape → cercas → inline → negrito) ──────────────────
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function md(src) {
  const parts = src.split("```");
  return parts.map((part, i) => {
    if (i % 2 === 1) {                                   // bloco de código
      const nl = part.indexOf("\n");
      const body = (nl >= 0 ? part.slice(nl + 1) : part).replace(/\n$/, "");
      return `<pre><code>${esc(body)}</code></pre>`;
    }
    let t = esc(part)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    return t.replace(/\n/g, "<br>");
  }).join("");
}
function renderAssistant(bubble, text) {
  if (!text) {
    bubble.innerHTML = '<span class="dots" aria-label="gerando"><i></i><i></i><i></i></span>';
  } else {
    bubble.innerHTML = md(text);
  }
  keepScroll();
}

// ── chamada ao vLLM (streaming SSE) ────────────────────────────────────────
async function send() {
  const box = $("prompt");
  const text = box.value.trim();
  if (!text || inFlight) return;
  if (!API_KEY) { note("Chave da API ausente no fragmento da URL (#k=…)."); return; }

  const promptEst = contextEstimate() + estimateTokens(text);
  const maxTokens = Math.max(64, Math.min(2048, CTX - promptEst - 256));
  if (promptEst > CTX - 64) {
    note(`Conversa em ~${fmt(promptEst)} tokens (teto ${fmt(CTX)}). Use ✂ Podar ou comece uma conversa nova.`);
    return;
  }

  $("empty").style.display = "none";
  box.value = ""; autosize();
  history.push({ role: "user", content: text });
  addBubble("user", text);

  const bubble = document.createElement("div");
  bubble.className = "msg assistant";
  log.appendChild(bubble);
  renderAssistant(bubble, "");
  $("send").disabled = true; $("stop").disabled = false;

  const controller = new AbortController();
  inFlight = controller;
  let acc = "";
  try {
    const resp = await fetch(API_URL + "/chat/completions", {
      method: "POST",
      signal: controller.signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: "system", content: systemContent() }, ...history],
        stream: true,
        stream_options: { include_usage: true },
        max_tokens: maxTokens,
        temperature: 0.7
      })
    });
    if (!resp.ok) {
      const body = await resp.text().catch(() => "");
      throw new Error(friendlyError(resp.status, body));
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        let evt; try { evt = JSON.parse(payload); } catch { continue; }
        if (evt.usage) {
          lastPromptTokens = evt.usage.prompt_tokens + (evt.usage.completion_tokens || 0);
        }
        const delta = evt.choices?.[0]?.delta?.content;
        if (delta) { acc += delta; renderAssistant(bubble, acc); }
      }
    }
    if (!acc) { acc = "(resposta vazia)"; bubble.textContent = acc; }
    history.push({ role: "assistant", content: acc });
  } catch (err) {
    if (controller.signal.aborted) {
      if (acc) { history.push({ role: "assistant", content: acc }); }
      else bubble.remove();
      note("Geração interrompida.");
    } else {
      bubble.remove();
      history.pop(); // a pergunta sai do histórico — o turno não aconteceu
      if (err instanceof TypeError) setStatus("err", `${MODEL} · servidor inacessível`);
      note("Falhou: " + (err.message || err));
    }
  } finally {
    inFlight = null;
    $("send").disabled = false; $("stop").disabled = true;
    box.focus();
    renderMeter();
    keepScroll();
  }
}
function friendlyError(status, body) {
  if (status === 401) return "401 — chave inválida (fragmento #k=… da URL).";
  if (status === 400 && /input_tokens|context length/i.test(body))
    return `400 — a conversa excedeu o contexto de ${fmt(CTX)} tokens. Use ✂ Podar ou comece uma conversa nova.`;
  return status + " — " + body.slice(0, 200);
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  log.appendChild(div);
  stickToBottom = true; scrollToBottom();
  return div;
}
function autosize() {
  const box = $("prompt");
  box.style.height = "auto";
  box.style.height = Math.min(200, box.scrollHeight) + "px";
}

// ── eventos ────────────────────────────────────────────────────────────────
$("send").addEventListener("click", send);
$("stop").addEventListener("click", () => inFlight?.abort());
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && inFlight) inFlight.abort();
});
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("prompt").addEventListener("input", autosize);
$("system").addEventListener("input", renderMeter);
$("clear").addEventListener("click", () => {
  if (inFlight) inFlight.abort();
  history.length = 0; lastPromptTokens = null;
  [...log.querySelectorAll(".msg, .sysnote")].forEach((el) => el.remove());
  refreshEmpty();
  note("Conversa nova. Contexto zerado.");
  renderMeter();
  $("prompt").focus();
});
$("prune").addEventListener("click", () => {
  if (inFlight) inFlight.abort();
  const firstPair = log.querySelectorAll(".msg");
  if (history.length >= 2) {
    history.splice(0, 2);
    if (firstPair.length >= 2) { firstPair[0].remove(); firstPair[1].remove(); }
    lastPromptTokens = null;
    note("Par mais antigo removido do contexto.");
  } else note("Nada a podar.");
  refreshEmpty();
  renderMeter();
});
document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    $("prompt").value = chip.textContent.trim();
    autosize();
    $("prompt").focus();
  });
});

// ── alternância modelo puro ↔ + VerboLang ──────────────────────────────────
function setVblMode(on) {
  vblMode = on;
  localStorage.setItem("vllm.vbl", on ? "1" : "0");
  $("mode-puro").setAttribute("aria-pressed", String(!on));
  $("mode-vbl").setAttribute("aria-pressed", String(on));
  renderMeter();
}
$("mode-puro").addEventListener("click", () => setVblMode(false));
$("mode-vbl").addEventListener("click", () => setVblMode(true));
async function loadSheet() {
  const candidates = ["../docs/VBL-CHEATSHEET.md", "docs/VBL-CHEATSHEET.md", "VBL-CHEATSHEET.md"];
  for (const path of candidates) {
    try {
      const r = await fetch(path);
      if (r.ok) { sheetText = await r.text(); break; }
    } catch { /* tenta o próximo */ }
  }
  const el = $("sheet-status");
  if (!sheetText) {
    el.textContent = "cheat sheet indisponível (sirva a raiz do repositório)";
    $("mode-vbl").disabled = true;
    if (vblMode) setVblMode(false);
    return;
  }
  el.textContent = `cheat sheet · ~${fmt(estimateTokens(sheetText))} tokens`;
  setVblMode(vblMode); // reflete o modo salvo e atualiza o medidor
}

// ── partida ────────────────────────────────────────────────────────────────
(async function boot() {
  refreshEmpty();
  autosize();
  try {
    const r = await fetch(API_URL + "/models", { headers: { "Authorization": "Bearer " + API_KEY } });
    setStatus(r.ok ? "ok" : "err", r.ok ? `${MODEL} · conectado` : `${MODEL} · HTTP ${r.status}`);
  } catch {
    setStatus("err", `${MODEL} · servidor inacessível`);
  }
  loadSheet();
  renderMeter();
  $("prompt").focus();
})();
</script>
