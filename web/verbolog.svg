<!--
verbolog.svg — marca do projeto VerboLang.
  Triângulo invertido de gradientes azul-verde-vermelho — ressoa como
  o V da marca. Cada lado é um traço de osciloscópio que mergulha num
  V (um pássaro); os três ápices formam uma fileira alinhada sobre a
  linha tracejada do horizonte, com a cor vazando para dentro.
Parte do projeto VerboLang — licenciado sob a GNU GPL-3.0 (ver LICENSE).
-->
